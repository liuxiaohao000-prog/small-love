name: Build XiaoAi Android APK

on:
  workflow_dispatch:
  push:
    branches: [build/android-app]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            android-build-payload-v2/part.00 \
            android-build-payload-v2/part.01 \
            android-build-payload-v2/part.02 \
            android-build-payload-v2/part.03 \
            android-build-payload-v2/part.04 \
            android-build-payload-v2/part.05a \
            android-build-payload-v2/part.05b \
            android-build-payload-v2/part.06 \
            android-build-payload-v2/part.07 \
            > android-project.b64
          base64 --decode android-project.b64 > android-project.tar.gz
          echo "ce5a759d2b7700fd0ce1a5af0cdcf7ba55000a2db784d2cf2a1fd93293024647  android-project.tar.gz" | sha256sum -c -
          mkdir android-project
          tar -xzf android-project.tar.gz -C android-project

      - name: Apply ColorOS safe-start patch
        shell: bash
        run: |
          set -euo pipefail
          cat patch-v101/MainActivity.part.00 patch-v101/MainActivity.part.01 patch-v101/MainActivity.part.02 > MainActivity.java.b64
          base64 --decode MainActivity.java.b64 > android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java
          sed -i 's/new WebView(getApplicationContext())/new WebView(this)/' android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java
          sed -i 's/versionCode 1/versionCode 2/' android-project/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.0.1'/" android-project/app/build.gradle
          cat > android-project/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.XiaoAi" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFF8FA</item>
                  <item name="android:navigationBarColor">#FFF8FA</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          node --check android-project/app/src/main/assets/www/game.js
          grep -q "oneplus12-balanced-60-safe" android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java
          grep -q "showStartupError" android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java
          ! grep -q "preferredRefreshRate" android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java
          ! grep -q "setBlockNetworkLoads" android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java
          grep -q "Math.min(window.devicePixelRatio || 1, 2)" android-project/app/src/main/assets/www/game.js

      - name: Build installable APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p android-project :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp android-project/app/build/outputs/apk/debug/app-debug.apk dist/xiaoai-kuai-pao-oneplus12-v1.0.1-safe.apk
          sha256sum dist/xiaoai-kuai-pao-oneplus12-v1.0.1-safe.apk > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoai-kuai-pao-oneplus12-v1.0.1-safe
          path: dist/
          if-no-files-found: error
          retention-days: 30
