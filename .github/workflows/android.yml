name: Build XiaoAi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/android-app
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          cat android-build-payload/part.* > android-project.tar.gz.b64
          base64 --decode android-project.tar.gz.b64 > android-project.tar.gz
          mkdir android-project
          tar -xzf android-project.tar.gz -C android-project
          test -f android-project/settings.gradle
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/app/src/main/assets/www/index.html
          test -f android-project/app/src/main/assets/www/game.js
          test -f android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Validate game source
        shell: bash
        run: |
          set -euo pipefail
          node --check android-project/app/src/main/assets/www/game.js
          grep -q "preferredRefreshRate = 60.0f" android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java
          grep -q "setBlockNetworkLoads(true)" android-project/app/src/main/java/com/xiaoyu/xiaoai/MainActivity.java
          grep -q "Math.min(window.devicePixelRatio || 1, 2)" android-project/app/src/main/assets/www/game.js

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android-project :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-project/app/build/outputs/apk/debug/app-debug.apk dist/xiaoai-kuai-pao-oneplus12-v1.0.0.apk
          sha256sum dist/xiaoai-kuai-pao-oneplus12-v1.0.0.apk | tee dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoai-kuai-pao-oneplus12-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
