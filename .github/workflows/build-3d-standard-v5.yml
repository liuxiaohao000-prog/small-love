name: Build XiaoAi Manor 3D Standard Model v5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/3d-standard-v5

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project and apply v5 patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'b52a68dbb97350b8728615dfdc336b9aeeff20d33dd8d3c7a2d0818b5f2f54eb  3d-v5/build-v5.sh.gz.b64' | sha256sum -c -
          base64 --decode 3d-v5/build-v5.sh.gz.b64 | gzip -dc > /tmp/build-v5.sh
          chmod +x /tmp/build-v5.sh
          /tmp/build-v5.sh prepare

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and verify APK
        shell: bash
        run: /tmp/build-v5.sh build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoAi-Manor-3D-StandardModel-DPad-v5.0.0
          path: |
            XiaoAi-Manor-3D-StandardModel-DPad-v5.0.0.apk
            APK-SHA256.txt
          retention-days: 14
